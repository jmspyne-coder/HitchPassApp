  var CANONICAL_ORIGIN = "https://hitchpass.vercel.app";

    var h = location.hostname;

              h.indexOf("anthropic")>-1 || h.indexOf("sandbox")>-1 || h.indexOf("usercontent")>-1 ||
              /^\d+\.\d+\.\d+\.\d+$/.test(h);
    return bad ? CANONICAL_ORIGIN : location.origin + location.pathname;
  }
  /* Share always points at the public landing page (/welcome), never the app/login screen, so a
     recipient who isn't a user lands on crawlable marketing content rather than a sign-in wall. */
  function shareURL(){
    var h = location.hostname;
    var bad = !h || h==="localhost" || h.indexOf(".local")>-1 || h.indexOf("claude")>-1 ||
              h.indexOf("anthropic")>-1 || h.indexOf("sandbox")>-1 || h.indexOf("usercontent")>-1 ||
              /^\d+\.\d+\.\d+\.\d+$/.test(h);

  function shareApp(){

  /* ---- engine ---- */
  /* Display brands (e.g. dc) carry no wallet card — access + rate resolve via accessVia. */
  function accessKey(p){ var n = NETWORKS[p.network]; return (n && n.accessVia) || p.network; }
  function cost(p){
    var ak = accessKey(p);
    var n = NETWORKS[ak];
    if (state.wallet.indexOf(ak)===-1) return { tier:"locked", price:"Add this card", label:TIER.locked.label };
    if (p.priceOverride) return p.priceOverride;
    return { tier:n.tier, price:n.price, label:TIER[n.tier].label };
  }
  function pill(info){
    var s = TIER[info.tier];
    var lk = info.tier==="locked" ? ic("lock",11,s.fg) : "";
    return '<span style="background:'+s.bg+';color:'+s.fg+';font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px">'+lk+info.label+' · '+esc(info.price)+'</span>';

  function isoDate(d){ function z(n){ return (n<10?"0":"")+n; } return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
  /* Lightweight transient toast, bottom-center, auto-dismiss. */
  function toast(msg){
    try {
      var t = document.getElementById("hpToast");
      if (!t){ t = document.createElement("div"); t.id = "hpToast";
        t.style.cssText = "position:fixed;left:50%;bottom:88px;transform:translateX(-50%);max-width:88%;background:#15110c;color:#f3eddd;font-size:13px;font-weight:600;line-height:1.35;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:9999;text-align:center;opacity:0;transition:opacity .2s";
        document.body.appendChild(t); }
      t.textContent = msg; t.style.opacity = "1";
      clearTimeout(t._h); t._h = setTimeout(function(){ t.style.opacity = "0"; }, 3600);
    } catch(e){}
  }
  /* Booking hand-off. The TT portal is a custom, cross-origin search page that ignores URL date
     params and can't be scripted from here, so we can't prefill or auto-fill its fields. Best we
     can do: copy the park name to the clipboard so the member pastes it into the location search
     in one tap (on iOS the keyboard surfaces a one-tap Paste chip). Then open the network site. */
  function bookingHandoff(parkName, network){
    var url = (NETWORKS[network] && NETWORKS[network].url) || "";
    if (parkName && navigator.clipboard){
      try { navigator.clipboard.writeText(parkName); toast("Copied “" + parkName + "” — paste it into the search box on the next screen"); } catch(e){}
    }
    if (url) window.open(url, "_blank");
  }
  function nightsBetween(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
  function todayLocalStr(){ var d=new Date(); function z(n){ return (n<10?"0":"")+n; } return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
  /* Single place that knows TT is tier-driven. Returns the resolved booking
     numbers for a park; non-TT (and TT with unknown/unset tier) fall back to the
     flat NETWORKS values, tierAware:false, no throw. */
  function effectiveBooking(p){
    var net = NETWORKS[p.network] || {};
    if (p.network==="tt" && ttTierRules[state.tier]){
      var r = ttTierRules[state.tier];
      return { window:r.window, maxDaysIn:r.maxDaysIn, daysOut:r.daysOut, parkToPark:r.parkToPark, tierKey:state.tier, tierAware:true };
    }
    // Encore / Trails Collection: window + max-stay depend on whether the member holds TC or TC+.
    if ((p.network==="enc" || p.network==="dc") && (hasTC() || hasTCPlus())){
      var win = hasTCPlus() ? 90 : 60, mx = hasTCPlus() ? 21 : 14;
      return { window:win, maxDaysIn:mx, daysOut:0, parkToPark:hasTCPlus(), tierKey:state.membership.tier, tierAware:true, tc:true };
    }
    return { window:net.window, maxDaysIn:net.maxStay, daysOut:0, parkToPark:false, tierAware:false };
  }
  /* Configured max-stay (nights) for a network, tier-aware via effectiveBooking — READ from config,
     never hardcoded. 0 means "no configured limit" (e.g. pa/gs) → callers show no warning. */
  function maxStayFor(network){ return effectiveBooking({ network:network }).maxDaysIn || 0; }
  function overStayInfo(network, dateIn, dateOut){
    var limit = maxStayFor(network), nights = nightsBetween(dateIn, dateOut);
    return (limit>0 && nights>limit) ? { nights:nights, limit:limit } : null;
  }
  /* Over-limit flag for a saved trip: prefer the flag captured at booking; fall back (legacy trips
     saved before this shipped) to a tier-aware recompute. */
  function tripOverStay(t){
    if (t.overStay && typeof t.overStay==="object") return t.overStay;
    if (t.overStay===false) return null;
    return overStayInfo(t.network, t.dateIn, t.dateOut);
  }
  function bookingInfo(p, dateInStr){
    var net = NETWORKS[p.network], eb = effectiveBooking(p);
    if (!net || !eb.window || !dateInStr) return null;
    var arrival = new Date(dateInStr+"T00:00:00");
    var openDate = new Date(arrival.getTime() - eb.window*86400000);
    var openIn = Math.ceil((openDate - new Date(new Date().toDateString()))/86400000);
    return { net:net, eb:eb, openDate:openDate, openIn:openIn, open:openIn<=0 };
  }
  function ensureTripIds(){ var ch=false; state.trips.forEach(function(t,i){ if(!t.id){ t.id=Date.now()+i; ch=true; } }); if(ch) persist(); }
  function tripById(id){ for(var i=0;i<state.trips.length;i++){ if(String(state.trips[i].id)===String(id)) return state.trips[i]; } return null; }

  function downloadReminder(p, dateInStr){
    if (!p) return;
    var net = NETWORKS[p.network], eb = effectiveBooking(p); if (!net || !eb.window || !dateInStr) return;
    var arrival = new Date(dateInStr+"T00:00:00");
    var openDate = new Date(arrival.getTime() - eb.window*86400000);
    function z(n){ return (n<10?"0":"")+n; }
    var ymd = openDate.getFullYear()+z(openDate.getMonth()+1)+z(openDate.getDate());
    var ics = "data:text/calendar;charset=utf8," + encodeURIComponent(

       "DESCRIPTION:Your "+eb.window+"-day booking window opens today. Reserve early—popular sites fill fast.",
       "END:VEVENT","END:VCALENDAR"].join("\n"));
    var a = document.createElement("a"); a.href = ics; a.download = "booking-reminder.ics";
    document.body.appendChild(a); a.click(); a.remove();
  }

    function tile(name,color,title,sub,arg){

  var EXPLORE_PER_PAGE = 24;

  /* All non-region axes (network, $0-only, search). Region is applied separately so chip counts can
     reflect "results within the current network selection" independent of the region choice. */
  function passesNonRegion(p, q){
    if (state.netFilter && p.network!==state.netFilter) return false;
    if (state.freeOnly && cost(p).tier!=="included") return false;
    if (q){ if ((p.name+" "+p.city+" "+p.st).toLowerCase().indexOf(q)===-1) return false; }
    return true;
  }
  function filteredParks(){
    var q = state.q.trim().toLowerCase();
    var hasReg = state.regionFilter.size>0;
    return PARKS.filter(function(p){
      if (state.favOnly && !isFav(p.id)) return false;
      if (!passesNonRegion(p,q)) return false;
      if (hasReg && !state.regionFilter.has(regionOf(p))) return false;   // region: independent geographic AND axis
      return true;
    });
  }
  /* Per-region live counts within the current non-region selection (drives chip labels + 0-hiding). */
  function regionCounts(){
    var q = state.q.trim().toLowerCase(), m = {};
    PARKS.forEach(function(p){ if (passesNonRegion(p,q)){ var r=regionOf(p); m[r]=(m[r]||0)+1; } });
    return m;
  }
  function hasCoord(p){ return typeof p.lat==="number" && typeof p.lng==="number"; }

    if (rig && p.maxRig && rig>p.maxRig) tags += ' <span style="font-size:11px;font-weight:700;color:'+C.clay+';background:rgba(168,71,47,.12);padding:3px 8px;border-radius:999px">Rig too long</span>';

  function listHTML(){
    var ps = filteredParks();
    if (!ps.length) return '<div style="padding:26px;text-align:center;color:'+C.muted+';font-size:13.5px">No parks match.</div>';
    var pages = Math.max(1, Math.ceil(ps.length/EXPLORE_PER_PAGE));
    if (state.explorePage>pages) state.explorePage=pages;
    if (state.explorePage<1) state.explorePage=1;
    var start = (state.explorePage-1)*EXPLORE_PER_PAGE;
    var pageItems = ps.slice(start, start+EXPLORE_PER_PAGE);
    var cards = pageItems.map(parkCardHTML).join("");
    var pager = "";
    if (pages>1){
      var prevDis = state.explorePage<=1, nextDis = state.explorePage>=pages;

  function exploreView(){
    var present = {}; PARKS.forEach(function(p){ present[p.network]=true; });
    var chips = '<button class="fchip tap'+(state.netFilter===""?" on":"")+'" data-act="netfilter" data-arg="">All</button>';
    Object.keys(NETWORKS).forEach(function(id){ if (present[id] && !NETWORKS[id].cardOnly) chips += '<button class="fchip tap'+(state.netFilter===id?" on":"")+'" data-act="netfilter" data-arg="'+id+'">'+esc(NETWORKS[id].short)+'</button>'; });
    var freeChip = '<button class="fchip tap'+(state.freeOnly?" on":"")+'" data-act="freeonly">$0 in my wallet</button>';
    var favChip = '<button class="fchip tap'+(state.favOnly?" on":"")+'" data-act="favonly">★ Saved</button>';
    // Region chips: REGION_ORDER, live count within current network selection, 0-count regions hidden.
    var rc = regionCounts();
    var regionChips = '<button class="fchip tap'+(state.regionFilter.size===0?" on":"")+'" data-act="regionall">All regions</button>';
    REGION_ORDER.forEach(function(r){
      var n = rc[r]||0; if (!n) return;   // hide regions with no parks under the current network filter
      regionChips += '<button class="fchip tap'+(state.regionFilter.has(r)?" on":"")+'" data-act="regionfilter" data-arg="'+esc(r)+'">'+esc(r)+' '+n+'</button>';
    });

  /* ---- Explore map (Leaflet + Leaflet.markercluster, lazy-loaded from CDN, online-only) ---- */
  function addMapCss(id, href){
    if (document.getElementById(id)) return;
    var lk=document.createElement("link"); lk.id=id; lk.rel="stylesheet"; lk.href=href; document.head.appendChild(lk);
  }
  function clusterReady(){ return typeof L!=="undefined" && typeof L.markerClusterGroup==="function"; }
  function ensureLeaflet(cb){
    if (clusterReady()){ cb(); return; }
    addMapCss("leaflet-css","https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
    addMapCss("mcluster-css","https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css");
    addMapCss("mcluster-css-def","https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css");
    /* markercluster (1.5.x, Leaflet-1.x compatible) must load AFTER Leaflet core. */
    function loadCluster(){
      if (typeof L.markerClusterGroup==="function"){ cb(); return; }
      var mc=document.getElementById("mcluster-js");
      if (!mc){
        mc=document.createElement("script"); mc.id="mcluster-js";
        mc.src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js";
        mc.onload=function(){ cb(); };
        mc.onerror=function(){ cb(); };   // degrade to un-clustered markers (initExploreMap checks)
        document.head.appendChild(mc);
      } else {
        var iv2=setInterval(function(){ if(typeof L.markerClusterGroup==="function"){ clearInterval(iv2); cb(); } }, 60);
      }
    }
    var sc=document.getElementById("leaflet-js");
    if (!sc){
      sc=document.createElement("script"); sc.id="leaflet-js"; sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      sc.onload=function(){ loadCluster(); };
      sc.onerror=function(){ var h=document.getElementById("mapHost"); if(h) h.innerHTML='<div style="padding:30px 20px;text-align:center;color:'+C.muted+';font-size:13.5px">Map needs a connection. Switch to List to browse offline.</div>'; };
      document.head.appendChild(sc);
    } else {
      var iv=setInterval(function(){ if(typeof L!=="undefined"){ clearInterval(iv); loadCluster(); } }, 60);
    }
  }
  function teardownMap(){ if (mapInstance){ try{ mapInstance.remove(); }catch(e){} mapInstance=null; } }
  function initExploreMap(){
    ensureLeaflet(function(){
      var host=document.getElementById("mapHost"); if(!host || typeof L==="undefined") return;
      teardownMap();
      mapInstance=L.map(host,{ zoomControl:true, attributionControl:true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ maxZoom:18, attribution:"© OpenStreetMap" }).addTo(mapInstance);
      var pts=filteredParks().filter(hasCoord);
      if (pts.length){
        var bounds=[], present={};
        // Cluster overlapping pins; rebuilt from the CURRENT filtered set on every render.
        // Falls back to direct markers if the plugin didn't load (offline first run, etc.).
        var cluster = (typeof L.markerClusterGroup==="function")
          ? L.markerClusterGroup({ showCoverageOnHover:false, spiderfyOnMaxZoom:true, chunkedLoading:true, maxClusterRadius:50 })
          : null;
        pts.forEach(function(p){
          var nw=NETWORKS[p.network]||{}, col=nw.color||C.ember;
          present[p.network]=true;
          var m=L.circleMarker([p.lat,p.lng],{ radius:6, weight:2, color:"#fff", fillColor:col, fillOpacity:.95 });
          m.bindPopup('<div style="min-width:150px"><div class="disp" style="font-weight:800;font-size:14px">'+esc(p.name)+'</div>'+
            '<div style="font-size:12px;color:#867d6c;margin:2px 0 8px">'+(p.city?esc(p.city)+', ':'')+esc(p.st)+' · '+esc(nw.short||p.network)+'</div>'+
            '<button type="button" data-mappark="'+p.id+'" style="background:'+C.ember+';color:#fff;border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer">Open details ›</button></div>');
          if (cluster) cluster.addLayer(m); else m.addTo(mapInstance);
          bounds.push([p.lat,p.lng]);
        });
        if (cluster) mapInstance.addLayer(cluster);
        mapInstance.fitBounds(bounds,{ padding:[28,28], maxZoom:9 });
        // legend — one entry per network present in the current view
        var legend=L.control({ position:"bottomright" });
        legend.onAdd=function(){
          var d=L.DomUtil.create("div");
          d.style.cssText="background:rgba(255,255,255,.92);padding:7px 9px;border-radius:9px;font:600 11.5px system-ui,sans-serif;color:#5b5446;box-shadow:0 1px 4px rgba(0,0,0,.2);line-height:1.7";
          d.innerHTML=Object.keys(NETWORKS).filter(function(id){ return present[id]; }).map(function(id){
            var nw=NETWORKS[id];
            return '<div style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:50%;background:'+(nw.color||C.ember)+';border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);display:inline-block"></span>'+esc(nw.name)+'</div>';
          }).join("");
          return d;
        };
        legend.addTo(mapInstance);
      } else {
        mapInstance.setView([39.5,-98.35], 3);   // continental US, no pins in this filter
      }
      mapInstance.on("popupopen", function(e){
        var node=e.popup.getElement(); if(!node) return;
        var btn=node.querySelector("[data-mappark]"); if(!btn) return;
        btn.onclick=function(){ state.selected=parseInt(btn.getAttribute("data-mappark"),10); state.dates={in:"",out:""}; render(); };
      });
      setTimeout(function(){ if(mapInstance) mapInstance.invalidateSize(); }, 0);
    });
  }

          '<span style="font-size:13.5px;font-weight:700">Booking window is open now</span></div>'+
          '<div style="font-size:12.5px;color:'+C.muted+';margin-top:5px;line-height:1.45">You’re inside '+esc(net.short)+'’s '+eb.window+'-day window — reserve these dates before they fill.</div></div>';
      }

    var stayWarn = overStay
      ? '<div style="margin-top:10px;display:flex;align-items:center;gap:6px;color:'+C.clay+';font-size:12.5px;font-weight:600">'+ic("alert",14,C.clay)+'These dates ('+nights+' nights) run past '+esc(net.short)+'’s '+eb.maxDaysIn+'-night max. You can still save it — TT can sometimes extend on request.</div>'
      : "";
    // Proactive max-stay map: show the latest checkout for the chosen arrival, with a one-tap "use max".
    var stayMap = "";
    if (isPro() && eb.maxDaysIn>0 && arrival){
      var maxOut = new Date(arrival.getTime() + eb.maxDaysIn*86400000);

        (state.dates.out===maxOutISO ? '' : '<button class="tap" data-act="usemax" data-arg="'+maxOutISO+'" style="margin-top:8px;font-size:12.5px;font-weight:700;color:'+C.ember+'">Use max checkout →</button>')+

    return head +
      '<div style="margin-top:14px;font-size:12.5px;color:'+C.muted+';font-weight:600">'+rules+'</div>'+
      highUseNotice+
      '<div style="display:flex;gap:10px;margin-top:12px">'+
        '<div style="flex:1"><div class="dlabel">Arrival</div><input class="dinput" type="date" data-date="in" value="'+esc(state.dates.in)+'" /></div>'+
        '<div style="flex:1"><div class="dlabel">Departure</div><input class="dinput" type="date" data-date="out" value="'+esc(state.dates.out)+'" /></div>'+

  function tripRenders(t){ return !!(parkById(t.parkId) || t.parkName); }

  function tripCard(t, past){
    var p = parkById(t.parkId);
    if (!p && !t.parkName) return "";           // orphan with no fallback name — drop (legacy behavior)
    var name = p ? p.name : (t.parkName || "Saved trip");
    var net = NETWORKS[t.network] || (p ? NETWORKS[p.network] : null);
    var nights = nightsBetween(t.dateIn, t.dateOut);
    var dateLine = (t.dateIn && t.dateOut)
      ? fmtDate(new Date(t.dateIn+"T00:00:00"))+" → "+fmtDate(new Date(t.dateOut+"T00:00:00"))+" · "+nights+" night"+(nights===1?"":"s")
      : "";

    var bw = "";
    if (t.booked){
      // booked reservation → check-in countdown (no booking-window math)
      if (!past && t.dateIn){
        var days = Math.ceil((new Date(t.dateIn+"T00:00:00") - new Date(new Date().toDateString()))/86400000);
        var label = days>0 ? (days+" day"+(days===1?"":"s")+" until check-in") : (days===0 ? "Check in today" : "");
        if (label) bw = '<div style="margin-top:10px"><span style="font-size:12px;font-weight:700;color:'+C.green+';background:rgba(47,107,70,.12);padding:4px 10px;border-radius:999px">'+label+'</span></div>';
      }
    } else if (p){
      // existing planning trip → booking-window pill (unchanged)
      var bi = past ? null : bookingInfo(p, t.dateIn);

    var subLine = p ? (esc(p.city)+', '+esc(p.st)) : (net ? esc(net.name) : "Off-database park");

    var bookedChip = t.booked ? '<span style="font-size:10.5px;color:'+C.green+';font-weight:700;background:rgba(47,107,70,.12);padding:2px 7px;border-radius:6px">Booked</span>' : "";
    var pillHTML = p ? pill(cost(p)) : "";

    var os = net ? tripOverStay(t) : null;   // flag carried from booking (tier-aware), legacy trips recompute
    var stayWarn = os
      ? '<div style="margin-top:8px;display:flex;align-items:center;gap:6px;color:'+C.clay+';font-size:12px;font-weight:600">'+ic("alert",13,C.clay)+'Over limit · '+os.nights+' nights exceeds '+esc(net.short)+'’s '+os.limit+'-night max.</div>'
      : "";

    var actions = '<div style="display:flex;gap:8px;margin-top:12px">'+
      (p ? '<button class="btnO tap" data-act="trip-view" data-arg="'+t.id+'" style="flex:1">View park</button>' : '')+
      '<button class="tap" data-act="trip-edit" data-arg="'+t.id+'" style="flex:1;padding:11px;text-align:center;border-radius:11px;border:1px solid rgba(31,28,23,.22);color:'+C.green+';font-weight:700;font-size:13px">Edit</button>'+

    return '<div class="tcard"'+(past?' style="opacity:.6"':'')+'>'+
      '<div style="display:flex;align-items:flex-start;gap:8px">'+

          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
            '<span class="disp" style="font-size:17px;font-weight:800">'+esc(name)+'</span>'+

          '</div>'+
          '<div style="font-size:12.5px;color:'+C.muted+';margin-top:2px">'+subLine+'</div>'+
        '</div>'+pillHTML+
      '</div>'+
      (dateLine? '<div style="font-size:13px;font-weight:600;margin-top:9px;display:flex;align-items:center;gap:6px">'+ic("calendar",14,C.pine)+esc(dateLine)+'</div>':'')+
      bw + chipsRow + noteRow + stayWarn + actions +
      (function(){

  /* ---- Auth flow (email OTP code). All async; re-render on completion. Never throws if sb is null. ---- */
  var subChannel = null;   // Supabase realtime channel on this user's subscriptions row
  /* THE invariant (spec Fix 3): isPro is the single source of truth for entitlement. It is derived
     only from the subscriptions row (active/trialing + not expired) — never from hp_plan_choice.
     Go-Free (2026-07-10): with ENABLE_STRIPE_CHECKOUT off, every user is entitled to every feature,
     so isPro() resolves true for all — unconditionally, before any surface renders. The state.isPaid
     read below is preserved intact so flipping ENABLE_STRIPE_CHECKOUT back on restores real gating. */
  function isPro(){ return FEATURES.ENABLE_STRIPE_CHECKOUT ? !!state.isPaid : true; }
  /* Safe GA4 event helper — conversion tracking for Google/Facebook ads (no-op if gtag is blocked). */
  function track(name, params){ try { if (window.gtag) window.gtag("event", name, params || {}); } catch(e){} }
  /* ---- Web Push: booking-window alerts (installed PWA / Android / desktop; not the TestFlight build) ---- */
  var VAPID_PUBLIC = "BFQJwjf-s67QP4QhudRAqxoSz9x4MFN4ALXQcJnZk-eX-y8_UMlPJ7m6SGg5TXsmx2oyzeVIMhk_MM1KHMIoLo8";
  function pushSupported(){ return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window); }
  function pushOn(){ try { return localStorage.getItem("hp_push_on")==="1"; } catch(e){ return false; } }
  function urlB64ToUint8Array(b64){
    var pad = "=".repeat((4 - b64.length % 4) % 4);
    var base = (b64 + pad).replace(/-/g,"+").replace(/_/g,"/");
    var raw = atob(base), out = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function computeReminders(){
    var out = [];
    (state.trips||[]).forEach(function(t){
      if (t.booked) return;                         // booked = already reserved
      var p = t.parkId ? parkById(t.parkId) : null;
      if (!p || !t.dateIn) return;
      var bi = bookingInfo(p, t.dateIn);
      if (bi && bi.openDate && bi.openIn>0){
        function z(n){ return (n<10?"0":"")+n; }
        var d = bi.openDate;
        out.push({ trip_id:String(t.id), park_name:p.name, fire_on:d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()) });
      }
    });
    return out;
  }
  function syncPush(subJson){
    var tok = state.account.session && state.account.session.access_token;
    if (!tok || !subJson) return;
    fetch("/api/push-register", { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+tok },
      body: JSON.stringify({ subscription: subJson, reminders: computeReminders() }) }).catch(function(){});
  }
  function refreshPushReminders(){
    if (!pushOn() || !pushSupported()) return;
    navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); })
      .then(function(sub){ if (sub) syncPush(sub.toJSON ? sub.toJSON() : sub); }).catch(function(){});
  }
  function enablePush(){
    if (!pushSupported()){ alert("To get booking-window alerts, add Hitch Pass to your Home Screen first (Share → Add to Home Screen), then turn alerts on from there."); return; }
    if (!state.account.session){ alert("Sign in first to turn on alerts."); return; }
    Notification.requestPermission().then(function(perm){
      if (perm !== "granted"){ alert("Notifications are blocked — enable them for Hitch Pass in Settings to get alerts."); return; }
      navigator.serviceWorker.ready.then(function(reg){
        reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC) })
          .then(function(sub){ try{ localStorage.setItem("hp_push_on","1"); }catch(e){} syncPush(sub.toJSON ? sub.toJSON() : sub); render(); })
          .catch(function(){ alert("Couldn’t turn on alerts. Try again."); });
      });
    });
  }
  /* ---- launch invite: ?invite=CODE comps a free year to the first N who claim it ---- */

  function maybeClaimInvite(){
    var code; try { code = localStorage.getItem("hp_invite"); } catch(e){ code = null; }
    if (!code || !sb) return;
    sb.auth.getSession().then(function(r){
      var session = (r && r.data) ? r.data.session : null;
      var tok = session && session.access_token;
      if (!tok) return;   // not signed in yet — retried on the next auth event
      fetch("/api/claim-invite", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok },
        body: JSON.stringify({ code: code })
      }).then(function(resp){ return resp.json(); }).then(function(d){
        try { localStorage.removeItem("hp_invite"); } catch(e){}
        var res = d && d.result;
        if (res === "granted" || res === "already"){ state.inviteMsg = "You’re in — Pro unlocked free for a year. 🎉"; track("invite_claim", { code: code, result: res }); refreshSubscription(); }
        else if (res === "exhausted"){ state.inviteMsg = "This invite is fully claimed — you’re on the free plan for now."; }
        render();
      }).catch(function(){});   // network error: keep hp_invite so it retries next load
    }).catch(function(){});
  }
  function initAuth(){
    if (!sb) return;
    // getSession reads the cached session from local storage (NO network) → offline-safe entry.
    sb.auth.getSession().then(function(r){ state.account.session = (r && r.data) ? r.data.session : null; state.authChecked = true; refreshSubscription(); subscribeRealtime(); maybeClaimInvite(); render(); }).catch(function(){ state.authChecked = true; render(); });
    sb.auth.onAuthStateChange(function(_e, session){ state.account.session = session || null; state.authChecked = true; state.isPaid = false; state.account.subStatus = null; if (session){ refreshSubscription(); subscribeRealtime(); maybeClaimInvite(); } else { state.upsell=null; unsubscribeRealtime(); } render(); });   // reset isPaid before re-deriving so one account's Pro can't carry into another session
    // Returning from Stripe Checkout: the webhook writes the row a few seconds AFTER redirect, so show a
    // "Confirming…" screen and poll until the row lands — instead of dropping the user back on the plan page
    // (which reads like the payment failed even though it succeeded).
    if (typeof location !== "undefined" && /[?&]checkout=success/.test(location.search || "")){
      startCheckoutConfirm();
    }
    // Returning from a successful tip: show a brief thank-you, mark the cadence, and strip the param.
    if (typeof location !== "undefined" && /[?&]tip=thanks/.test(location.search || "")){
      state.tipToast = true; tipBooted = true; markTipShown();
      try { history.replaceState({}, "", location.pathname); } catch(e){}
      setTimeout(function(){ state.tipToast = false; render(); }, 4000);
    }
  }
  /* Reads the user's subscription row (RLS = own row only) and derives isPro. Drives the badge AND the gates. */
  function refreshSubscription(){
    if (!sb){ state.isPaid = false; state.account.subStatus = null; return Promise.resolve(); }
    // Read entitlement with an EXPLICITLY-authenticated PostgREST request. supabase-js intermittently
    // fails to attach the user JWT to from() queries on the checkout-return load (the session is restored
    // but the rest client stays anon), so RLS returns []. Pulling the token from getSession() and sending
    // it ourselves (apikey + Bearer) guarantees the authed read — entitlement still derives ONLY from the row.
    return sb.auth.getSession().then(function(r){
      var session = (r && r.data && r.data.session) || state.account.session;
      var tok = session && session.access_token;
      var uid = session && session.user && session.user.id;
      if (session) state.account.session = session;
      if (!tok || !uid){ state.isPaid = false; state.account.subStatus = null; return; }
      // Read ONLY status. This project's PostgREST returns [] unpredictably for other select shapes
      // (verified via headless repro: select=* and select=status,current_period_end each returned [] in
      // different schema-cache states, silently keeping isPaid false and stranding checkout on "confirming").
      // select=status returned the row in EVERY test. Status already reflects Stripe cancellation (the
      // webhook sets canceled/past_due when a period lapses), so gating on status is correct and robust.
      // cache:"no-store" forces every read to hit the network rather than replay a stale empty result.
      return fetch(SUPABASE_URL + "/rest/v1/subscriptions?select=status&user_id=eq." + uid, {
        cache: "no-store",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + tok }
      }).then(function(resp){ return resp.ok ? resp.json() : []; }).then(function(rows){
        var row = rows && rows[0];
        if (row) {
          // A row present is authoritative: active/trialing -> Pro, anything else (canceled/past_due) -> Free.
          state.isPaid = (row.status === "active" || row.status === "trialing");
          state.account.subStatus = row.status;
        } else if (!state.isPaid) {
          // No row AND not already Pro -> Free. Do NOT clobber a just-confirmed Pro on an empty read:
          // PostgREST has a brief read-after-write lag that returns [] right after the row is written,
          // and an in-flight focus/boot read could otherwise undo the confirm-checkout flip. Cancellation
          // is a row with status=canceled (handled above), never an empty result, so this stays correct.
          state.account.subStatus = null;
        }
        if (state.isPaid) state.upsell = null;   // going Pro dismisses any open upgrade prompt
        maybeShowTip();                          // Tip jar: raise the 14-day prompt once entitlement is known
        maybeShowInstall();                      // Then the install nudge, only if tip/share didn't take the stage
        render();
      });
    }).catch(function(){});
  }
  /* Realtime: flip the UI the instant the webhook writes the row — no reload, ahead of the poll (spec Fix 3). */
  function subscribeRealtime(){
    if (!sb || subChannel) return;
    var sess = state.account.session;
    var u = sess && sess.user;
    if (!u) return;
    try {
      // Authenticate the realtime socket so RLS authorizes postgres_changes on the user's own row.
      if (sess.access_token) { try { sb.realtime.setAuth(sess.access_token); } catch(e){} }
      subChannel = sb.channel("sub-"+u.id)
        .on("postgres_changes", { event:"*", schema:"public", table:"subscriptions", filter:"user_id=eq."+u.id }, function(){ refreshSubscription(); })
        .subscribe();
    } catch(e){ subChannel = null; }
  }
  function unsubscribeRealtime(){ if (sb && subChannel){ try { sb.removeChannel(subChannel); } catch(e){} subChannel = null; } }
  /* After returning from Stripe Checkout, the webhook writes the subscription row a few seconds later.
     Poll for it and keep a "Confirming…" screen up until isPaid flips true or the window elapses, so a
     paying user never lands back on the plan page thinking it failed. */
  function startCheckoutConfirm(){
    if (!sb) return;
    state.confirmCheckout = true; state.confirmTimedOut = false;
    var attempts = 0, MAX = 8;   // ~8 × 3s ≈ 24s — fallback if the synchronous reconcile below fails
    render();
    function stripParam(){ try { history.replaceState({}, "", location.pathname); } catch(e){} }
    function succeed(){ if (!state._boughtTracked){ state._boughtTracked = true; track("purchase", { currency: "USD" }); } state.confirmCheckout = false; stripParam(); render(); }   // conversion: Pro purchase confirmed
    function tick(){
      attempts++;
      // Chain on the CONFIRMED result — refreshSubscription is the only thing that can set isPaid true.
      refreshSubscription().then(function(){
        if (state.isPaid){ succeed(); }                          // confirmed active/trialing row → Pro/success
        else if (attempts >= MAX){                               // window elapsed, still no active row → pending
          state.confirmCheckout = false; state.confirmTimedOut = true; stripParam(); render();
        } else { setTimeout(tick, 3000); }
      });
    }
    var pollStarted = false;
    function beginPoll(){ if (!pollStarted){ pollStarted = true; tick(); } }
    // Reconcile Stripe -> Supabase synchronously first so we don't race the async webhook. The endpoint
    // writes the row before responding; we then read it (entitlement still comes ONLY from the row).
    // IMPORTANT: resolve the session HERE via getSession(). This runs at page-load, BEFORE initAuth's
    // getSession() has populated state.account.session — so reading the token off state would be empty and
    // we'd silently skip the reconcile and just poll (the bug that caused the post-checkout pending screen).
    sb.auth.getSession().then(function(r){
      var session = r && r.data && r.data.session;
      if (session) state.account.session = session;   // ensure refreshSubscription can read the row
      var tok = session && session.access_token;
      if (tok){
        fetch("/api/confirm-checkout", { method:"POST", headers:{ "Authorization":"Bearer "+tok } })
          .then(function(resp){ return resp.json(); })
          .then(function(d){
            // confirm-checkout is server-side truth: it reads the Stripe subscription AND writes the row.
            // Trust its active flag for the immediate flip — this avoids the read-after-write lag where the
            // client's RLS read returns [] for several seconds right after the row is written.
            if (d && d.active){ state.isPaid = true; state.upsell = null; succeed(); }
            else { return refreshSubscription().then(function(){ if (state.isPaid) succeed(); else beginPoll(); }); }
          })
          .catch(function(){ beginPoll(); });
        setTimeout(beginPoll, 8000);   // safety net if reconcile never resolves
      } else {
        beginPoll();   // no session token yet — poll the row; initAuth restores the session shortly
      }
    }).catch(function(){ beginPoll(); });
  }
  function authSubscribe(plan){
    var a = state.account;
    if (!FEATURES.ENABLE_STRIPE_CHECKOUT){ return; }   // Go-Free: paid checkout is off — never hit /api/create-checkout
    if (IS_IOS_APP){ return; }   // in-app purchases disabled on iOS (App Store 3.1.1) — upgrade on the web
    if (!sb || !a.session){ a.error = "Sign in first to subscribe."; render(); return; }
    a.busy = true; a.error = ""; a.payUnavailable = false; render();
    track("begin_checkout", { plan: plan });   // funnel: started Stripe checkout
    fetch("/api/create-checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + a.session.access_token },
      body: JSON.stringify({ plan: plan })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.url){ window.location.href = d.url; }
      else { a.busy = false; a.payUnavailable = true; a.error = (d && d.error) || "Payments aren’t live yet."; render(); }
    }).catch(function(){ a.busy = false; a.payUnavailable = true; a.error = "Payments aren’t live yet."; render(); });

  /* Email + password auth. Log in or create account (Confirm-email is OFF, so signUp returns a session
     immediately — no verification email). Errors are surfaced inline; nothing fails silently. */
  function authPassword(){
    var a = state.account;

    a.busy = true; a.error = ""; render();

  /* ---- Membership ROI dashboard (Part E1) ---- */
  var RETAIL_NIGHT = 65;   // avg retail nightly rate assumption (directive)
  function amortizedPurchase(m){ var price=parseFloat(m.purchasePrice); return (isFinite(price)&&price>0) ? price/10 : 0; }   // conservative 10-yr hold
  function nightsThisYear(){
    var y=(new Date()).getFullYear(), total=0, parks={};
    state.stays.forEach(function(s){
      if (!s.dateIn || !s.dateOut) return;
      var n=nightsBetween(s.dateIn,s.dateOut);
      if (n>0 && new Date(s.dateIn+"T00:00:00").getFullYear()===y){ total+=n; parks[s.parkId||s.parkName]=1; }
    });
    return { nights:total, parks:Object.keys(parks).length };
  }
  function roiStats(){
    var m=state.membership, dues=parseFloat(m.annualDues)||0, amort=amortizedPurchase(m), annualCost=dues+amort;
    var uy=nightsThisYear(), nights=uy.nights;
    var now=new Date(), startYr=new Date(now.getFullYear(),0,1);
    var dayOfYear=Math.max(1,Math.round((now-startYr)/86400000)+1);
    var pace=nights*(365/dayOfYear);
    return {
      annualCost:annualCost, nights:nights,
      costPerNight: nights>0 ? annualCost/nights : null,
      savings: nights*RETAIL_NIGHT - annualCost,
      breakEven: annualCost>0 ? Math.ceil(annualCost/RETAIL_NIGHT) : null,
      projSavings: pace*RETAIL_NIGHT - annualCost,
      hasCost: annualCost>0
    };
  }

  /* ---- Booking Dates: single-park calc + Action Dates dashboard (Part B) ---- */
  function targetOf(p){ return state.watch[p.id] || ""; }
  function bookingWindowFor(p){
    var eb=effectiveBooking(p), target=targetOf(p);
    if (!eb.window || !target) return null;
    var arrival=new Date(target+"T00:00:00");
    var openDate=new Date(arrival.getTime()-eb.window*86400000);
    var openIn=Math.ceil((openDate-new Date(new Date().toDateString()))/86400000);
    return { window:eb.window, openDate:openDate, openIn:openIn, open:openIn<=0, arrival:arrival, eb:eb };
  }
  function bookingDatesSection(){
    var m=state.membership, def=membershipDef(m.tier);
    var favs=state.favorites.map(parkById).filter(Boolean);
    var head='<div class="det"><div class="dlabel" style="font-size:12px">Your booking window</div>'+
      '<div style="font-size:12.5px;color:'+C.muted+';margin-top:5px;line-height:1.5">On <b style="color:'+C.ink+'">'+esc(def?def.name:"your plan")+'</b> you can book TT parks up to <b style="color:'+C.ink+'">'+(def?def.bookingWindowDays:180)+' days</b> ahead'+
      (hasTC()?(' · Trails Collection up to <b style="color:'+C.ink+'">'+(hasTCPlus()?90:60)+' days</b>'):'')+'. Set a target arrival on a saved park to see exactly when its window opens.</div></div>';
    if (!favs.length){
      return head+'<div class="det"><div style="font-size:13px;color:'+C.muted+';line-height:1.55;text-align:center;padding:8px 4px">Favorite parks in <b style="color:'+C.ink+'">Explore</b> (tap the ☆), then come back to line up your booking dates.</div>'+
        '<button class="btnG tap" data-act="nav" data-arg="explore" style="margin-top:6px">Browse parks</button></div>';
    }
    // Editor: each favorite gets a target-arrival date input + live status
    var rows=favs.map(function(p){
      var net=NETWORKS[p.network]||{}, bw=bookingWindowFor(p);
      var status;
      if (!targetOf(p)) status='<span style="color:'+C.muted+';font-size:12px">Set a target arrival →</span>';
      else if (bw && bw.open) status='<span style="color:'+C.green+';font-weight:700;font-size:12px">🟢 Book now (open '+ (bw.openIn===0?"today": Math.abs(bw.openIn)+"d ago")+')</span>';
      else if (bw) status='<span style="color:'+C.ember+';font-weight:700;font-size:12px">Opens in '+bw.openIn+' day'+(bw.openIn===1?"":"s")+' ('+fmtDate(bw.openDate)+')</span>';
      else status='<span style="color:'+C.muted+';font-size:12px">No fixed window</span>';
      return '<div style="padding:11px 0;border-top:1px solid rgba(31,28,23,.07)">'+
        '<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font-size:14px;font-weight:700">'+esc(p.name)+'</span>'+
          '<span style="font-size:10.5px;color:'+C.muted+';font-weight:700;background:#f0ebdd;padding:2px 7px;border-radius:6px">'+esc(net.short||p.network)+'</span></div>'+
        '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">'+
          '<input class="dinput" data-watch="'+p.id+'" type="date" value="'+esc(targetOf(p))+'" style="flex:1;margin:0" />'+
          (targetOf(p)?'<button class="tap" data-act="watch-clear" data-arg="'+p.id+'" style="font-size:12px;color:'+C.muted+';padding:6px">Clear</button>':'')+
        '</div>'+
        '<div style="margin-top:7px">'+status+'</div></div>';
    }).join("");
    var editor='<div class="det"><div class="dlabel" style="font-size:12px">Saved parks — target arrivals</div>'+rows+'</div>';
    // Calendar: bucket favorites that have a target
    var withT=favs.filter(function(p){ return !!targetOf(p) && bookingWindowFor(p); })
      .map(function(p){ return { p:p, bw:bookingWindowFor(p) }; })
      .sort(function(a,b){ return a.bw.openDate-b.bw.openDate; });
    var cal="";
    if (withT.length){
      function bucket(title,items,col){
        if(!items.length) return "";
        return '<div style="margin-top:12px"><div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:'+col+'">'+title+'</div>'+
          items.map(function(it){
            var net=NETWORKS[it.p.network]||{};
            var when = it.bw.open ? ("window open") : ("opens "+fmtDate(it.bw.openDate));
            return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(31,28,23,.06)"><span style="font-size:13px;font-weight:600">'+esc(it.p.name)+' <span style="color:'+C.muted+';font-weight:700;font-size:10.5px">'+esc(net.short||it.p.network)+'</span></span><span style="font-size:12px;color:'+C.muted+'">'+when+'</span></div>';
          }).join("")+'</div>';
      }
      var now=withT.filter(function(x){ return x.bw.open; });
      var soon=withT.filter(function(x){ return !x.bw.open && x.bw.openIn<=14; });
      var later=withT.filter(function(x){ return !x.bw.open && x.bw.openIn>14; });
      cal='<div class="det"><div class="dlabel" style="font-size:12px">📅 Your booking calendar</div>'+
        (now.length||soon.length||later.length?"":'<div style="font-size:12.5px;color:'+C.muted+';margin-top:6px">Set target dates above to populate this.</div>')+
        bucket("🟢 Book now",now,C.green)+bucket("🟡 Opening soon",soon,C.ember)+bucket("⏳ Upcoming",later,C.muted)+'</div>';
    }
    return head + cal + editor;
  }

  /* ---- Tier recommendation wizard (Part F) ---- */
  var WIZ_Q = [
    { key:"nights", q:"How many nights a year do you camp?", opts:[["<20","Under 20"],["20-40","20 to 40"],["40-80","40 to 80"],["80+","80 or more"]] },
    { key:"multiRegion", q:"Do you travel to multiple regions?", opts:[["no","No, mostly one area"],["yes","Yes, all over"]] },
    { key:"longStays", q:"Do you want stays longer than 14 days?", opts:[["no","No"],["yes","Yes"]] },
    { key:"winter", q:"Do you camp Florida or Arizona in winter?", opts:[["no","No"],["yes","Yes"]] },
    { key:"plan", q:"How far ahead do you usually plan?", opts:[["1-3","1 to 3 months"],["4","About 4 months"],["5","About 5 months"],["6","6 months or more"]] }
  ];
  function wizardAnswer(val){
    var w=state.memWizard; if(!w) return;
    var q=WIZ_Q[w.step]; if(!q) return;
    w.ans[q.key]=val; w.step++;
    if (w.step>=WIZ_Q.length){ var res=wizardRecommend(w.ans); w.result=res.tier; w.rationale=res.why; }
    render();
  }
  function wizardRecommend(a){
    var plan=a.plan||"1-3";
    var months = plan==="6"?6 : plan==="5"?5 : plan==="4"?4 : 2;
    var nights = a.nights==="80+"?90 : a.nights==="40-80"?60 : a.nights==="20-40"?30 : 12;
    var tier, why;
    // Low usage, single region, short stays, plans near-term → the entry Zone pass.
    if (nights<=30 && a.multiRegion!=="yes" && a.longStays!=="yes" && a.winter!=="yes" && months<=3){
      tier="zone_pass"; why="Low usage in one region with short stays — the entry Zone pass covers it without paying for a wider booking window.";
    } else {
      if (months>=6) tier="adventure"; else if (months>=5) tier="explore"; else if (months>=4) tier="explore"; else tier="journey";
      // Winter sunbelt is high-use — the longest booking window wins the good sites.
      if (a.winter==="yes"){ tier = (months>=5 || a.multiRegion==="yes") ? "adventure" : "explore"; }
      var d=MEMBERSHIP_TIERS[tier];
      why = "Park-to-park stays up to 21 days and a "+d.bookingWindowDays+"-day booking window fit "+(a.winter==="yes"?"winter sunbelt high-use season":(a.multiRegion==="yes"?"multi-region travel":"how far ahead you plan"))+".";
    }
    return { tier:tier, why:why };
  }

  function perksNum(v){

  function perksImproves(cur, next){
    if (next==="No") return false;

    if (cur==="Option to Join" && next==="Yes") return true;       // now bundled in
    var cn=perksNum(cur), nn=perksNum(next);
    if (cn!=null && nn!=null && nn>cn) return true;                // bigger count / wider window
    if (cur==="Choose Region(s)" && /^All/.test(next)) return true; // regional → national

  function savingsCalc(){
    var tl = state.tools;
    var nights = Math.max(0, parseFloat(tl.nights) || 0);
    var per = Math.max(0, parseFloat(tl.perNight) || 0);
    var dues = Math.max(0, parseFloat(tl.dues) || 0);
    return { net: nights*per - dues, payN: per>0 ? Math.ceil(dues/per) : null };
  }
  function fmtMoney(n){ return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US"); }

  /* Build the SMS deep link addressed to the salesperson, prefilled in first
     person as the account holder. Returns null if required fields are missing. */
  function buildReferralSMS(){
    var prof = state.profile, r = state.refer;
    var sales = prof.salesPhone ? String(prof.salesPhone).replace(/[^\d+]/g,"") : "";
    var friendName = (r.friendName||"").trim();
    var friendPhone = (r.friendPhone||"").trim();
    if (!sales || !friendName || !friendPhone) return null;
    var salesName = (prof.salesName||"there").trim();
    var yourName = (prof.fullName||"").trim();
    var friendEmail = (r.friendEmail||"").trim();
    var intro = yourName ? ("Hey "+salesName+", it's "+yourName+".") : ("Hey "+salesName+".");
    var body = intro+" I'm referring a friend — "+friendName+". Their number is "+friendPhone+
      (friendEmail ? " and email is "+friendEmail : "")+
      ". They're expecting you to reach out. Thanks!";
    return "sms:"+sales+"?&body="+encodeURIComponent(body);
  }

  function referCanSend(){
    var r = state.refer;
    var hasSales = !!(state.profile.salesPhone && String(state.profile.salesPhone).trim());
    return hasSales && !!(r.friendName||"").trim() && !!(r.friendPhone||"").trim();

  /* ---- First-use grace period ----
     Both the tip jar and the share prompt used "never shown before" as license to show immediately,
     which fired either overlay in the same session as signup — before a new user had gotten any value
     from the app. firstSeenAt() stamps once per device on first check and both *Due() functions now
     require this grace period to have passed, on top of their existing repeat-interval. */
  var FIRST_SEEN_KEY = "hitchpass.firstSeen";
  var PROMPT_GRACE_MS = 3 * 24 * 60 * 60 * 1000;
  function firstSeenAt(){
    try {
      var v = localStorage.getItem(FIRST_SEEN_KEY);
      if (!v){ v = String(Date.now()); localStorage.setItem(FIRST_SEEN_KEY, v); }
      return parseInt(v, 10);
    } catch(e){ return Date.now(); }
  }
  function pastPromptGrace(){ return (Date.now() - firstSeenAt()) >= PROMPT_GRACE_MS; }

  /* ---- Tip jar (one-time donations) ----
     A friendly "support this project" prompt shown at most once every 14 days to BOTH Free and Pro.
     The cadence lives in its own localStorage key. The tip is mode:payment in /api/tip — it never
     creates a subscriptions row, so a tip can't be confused for a Pro grant. */
  var TIP_KEY = "hitchpass.tipLastShown";
  var TIP_INTERVAL_MS = 14 * 24 * 60 * 60 * 1000;
  function tipDue(){
    try {
      var last = parseInt(localStorage.getItem(TIP_KEY) || "0", 10);
      if (!(last > 0)) return pastPromptGrace();   // never shown before: honor the new-user grace period
      return (Date.now() - last) >= TIP_INTERVAL_MS;   // already shown before: existing cadence, unaffected by the grace period
    } catch(e){ return true; }
  }
  function markTipShown(){ try { localStorage.setItem(TIP_KEY, String(Date.now())); } catch(e){} }
  var tipBooted = false;   // once per page load

  /* ---- Share prompt: 7-day cadence, offset from the tip jar so the two never stack ---- */
  var SHARE_KEY = "hitchpass.shareLastShown";
  var SHARE_INTERVAL_MS = 7 * 24 * 60 * 60 * 1000;
  function shareDue(){
    try {
      var last = parseInt(localStorage.getItem(SHARE_KEY) || "0", 10);
      if (!(last > 0)) return pastPromptGrace();   // never shown before: honor the new-user grace period
      return (Date.now() - last) >= SHARE_INTERVAL_MS;   // already shown before: existing cadence, unaffected by the grace period
    } catch(e){ return true; }
  }
  function markShareShown(){ try { localStorage.setItem(SHARE_KEY, String(Date.now())); } catch(e){} }
  var shareBooted = false;
  /* Raise the share prompt only when the tip prompt is NOT taking the stage. Same entry gates as the
     tip jar, plus a hard rule to never overlap the tip prompt or its thank-you toast. */
  function maybeShowShare(){
    if (shareBooted) return;
    if (!signedIn() || !hasChosenPlan() || state.confirmCheckout) return;
    if (state.tipPrompt || state.tipToast) return;   // never stack on the tip jar
    if (!shareDue()){ shareBooted = true; return; }
    shareBooted = true; state.sharePrompt = true; render();
  }

  /* Raise the tip prompt once entitlement is known and the main app is visible — never over the front
     door, the onboarding plan choice, the post-checkout confirm screen, or a thank-you toast. When the
     tip prompt is NOT shown (already shown this load, or not due), hand off to the share prompt. */
  function maybeShowTip(){
    if (!FEATURES.SHOW_DONATION_PROMPT){ tipBooted = true; maybeShowShare(); return; }   // donation prompt off -> hand straight to the share prompt
    if (tipBooted){ maybeShowShare(); return; }
    if (!signedIn() || !hasChosenPlan() || state.confirmCheckout || state.tipToast) return;
    if (!tipDue()){ tipBooted = true; maybeShowShare(); return; }
    tipBooted = true; state.tipPrompt = true; render();
  }
  /* POST the chosen amount (cents) to /api/tip and redirect to Stripe Checkout. Sends the auth token
     when signed in (cleaner receipt); the server validates and bounds the amount regardless. */
  function sendTip(cents){
    if (state.tipBusy) return;
    state.tipBusy = true; state.tipError = ""; render();
    var a = state.account;
    var headers = { "Content-Type": "application/json" };
    if (a && a.session && a.session.access_token) headers.Authorization = "Bearer " + a.session.access_token;
    fetch("/api/tip", { method: "POST", headers: headers, body: JSON.stringify({ amount: cents }) })
      .then(function(r){ return r.json(); }).then(function(d){
        if (d && d.url){ markTipShown(); window.location.href = d.url; }
        else { state.tipBusy = false; state.tipError = (d && d.error) || "Couldn’t start the tip. Please try again."; render(); }
      }).catch(function(){ state.tipBusy = false; state.tipError = "Couldn’t start the tip. Please try again."; render(); });
  }
  function dismissTip(){
    state.tipPrompt = false; state.tipCustomOpen = false; markTipShown(); render();
    // If share is also due, let it follow after a short beat so the two don't flash together.
    if (shareDue()) setTimeout(maybeShowShare, 500);
  }
  function dismissShare(){ state.sharePrompt = false; markShareShown(); render(); }

  /* ---- Install prompt: "Add to Home Screen" nudge for un-installed visitors ----
     Android/Chrome fire beforeinstallprompt, which we capture and replay from our own button.
     iOS Safari has no such event, so we show Apple's Share -> Add to Home Screen instructions.
     Lowest-priority prompt: never stacks over the tip jar or share sheet; 14-day dismiss cadence. */
  var INSTALL_KEY = "hitchpass-install-dismissed";
  var INSTALL_INTERVAL_MS = 14 * 24 * 60 * 60 * 1000;
  var deferredInstall = null;   // captured beforeinstallprompt event (Android/Chrome only)
  var installPlatform = null;   // "ios" | "android"
  var justSignedUp = false;     // armed once when an account is created this session; gates the nudge to the signup moment (resets on reload → no later-visit nagging)
  function installDismissedRecently(){
    try { var last = parseInt(localStorage.getItem(INSTALL_KEY) || "0", 10);
      return last > 0 && (Date.now() - last) < INSTALL_INTERVAL_MS; } catch(e){ return false; }
  }
  function markInstallDismissed(){ try { localStorage.setItem(INSTALL_KEY, String(Date.now())); } catch(e){} }
  function isStandalone(){
    try { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; } catch(e){ return false; }
  }
  /* iOS Safari only. Chrome/Firefox on iOS (CriOS/FxiOS) can't add to Home Screen, so exclude them.
     iPadOS reports as MacIntel, so treat a touch-capable "Mac" as iOS too. */
  function iosSafari(){
    var ua = navigator.userAgent || "";
    var isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|Chrome|Android/.test(ua);
    return isIos && isSafari;
  }
  /* Raise the install nudge as the final step of signup — right after account creation, before plan
     selection — gated on justSignedUp so it never fires as a random nudge on a later visit. Never over
     the tip jar / share / post-checkout confirm. Android needs the captured event; iOS falls back to
     instructions. Idempotent: safe to call from the signup handler and from the beforeinstallprompt
     handler (which can land before OR after account creation within the same session). */
  function maybeShowInstall(){
    if (state.installPrompt) return;                 // already open
    if (isStandalone()) return;                      // already installed
    if (!signedIn() || !justSignedUp || state.confirmCheckout) return;   // signup moment only
    if (state.tipPrompt || state.tipToast || state.sharePrompt) return;   // never stack
    if (installDismissedRecently()) return;
    var plat = deferredInstall ? "android" : (iosSafari() ? "ios" : null);
    if (!plat) return;                               // wait for beforeinstallprompt, or not an installable context
    installPlatform = plat;
    state.installPrompt = true;
    render();

  /* Replay the captured native install prompt (Android/Chrome). Whatever the user chooses, respect the
     14-day cadence so we don't re-nag on the next visit. */
  function doInstall(){
    var e = deferredInstall;
    if (!e){ dismissInstall(); return; }
    state.installPrompt = false; markInstallDismissed(); render();
    try {
      e.prompt();
      if (e.userChoice && e.userChoice.then){ e.userChoice.then(function(){ deferredInstall = null; }, function(){ deferredInstall = null; }); }
      else { deferredInstall = null; }
    } catch(err){ deferredInstall = null; }

  /* ---- Add a trip to Google / Outlook / Apple calendars (all-day, spanning the stay) ---- */
  function tripCalData(t){
    var p = t.parkId ? parkById(t.parkId) : null;
    var name = p ? p.name : (t.parkName || "Saved trip");
    var net = NETWORKS[t.network] || (p ? NETWORKS[p.network] : null);
    var title = "Hitch Pass · " + name + (net ? " ("+net.short+")" : "");
    var nights = nightsBetween(t.dateIn, t.dateOut);
    function compact(iso){ return iso ? iso.replace(/-/g,"") : ""; }
    function plusDays(iso, n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); function z(x){return (x<10?"0":"")+x;} return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
    var endExclIso = plusDays(t.dateOut, 1);   // all-day end is exclusive; +1 covers the checkout day
    var details = nights+" night"+(nights===1?"":"s")+" stay"+(t.confirmation?" · Confirmation "+t.confirmation:"")+(t.note?" · "+t.note:"")+" · via Hitch Pass";
    return { name:name, title:title, loc:name, startIso:t.dateIn, endExclIso:endExclIso, startYMD:compact(t.dateIn), endYMD:compact(endExclIso), details:details };
  }
  function downloadTripIcs(t){
    if (!t || !t.dateIn || !t.dateOut) return;
    var c = tripCalData(t);
    var ics = "data:text/calendar;charset=utf8," + encodeURIComponent(
      ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
       "DTSTART;VALUE=DATE:"+c.startYMD,"DTEND;VALUE=DATE:"+c.endYMD,
       "SUMMARY:"+c.title,"LOCATION:"+c.loc,"DESCRIPTION:"+c.details,
       "END:VEVENT","END:VCALENDAR"].join("\n"));
    var a=document.createElement("a"); a.href=ics; a.download="hitchpass-trip.ics"; document.body.appendChild(a); a.click(); a.remove();
    state.calTripId=null; render();
  }

      }
      return;
    }
    var rk = t.getAttribute("data-refer");
    if (rk){ state.refer[rk]=t.value; updateReferBtn(); return; }
    var pk = t.getAttribute("data-profile");
    if (pk){ state.profile[pk]=t.value; persist(); return; }
    var mk = t.getAttribute("data-member");
    if (mk){ if(!state.profile.members) state.profile.members={}; state.profile.members[mk]=t.value; persist(); return; }
    var ak = t.getAttribute("data-auth");
    if (ak){ state.account[ak]=t.value; if(state.account.error) state.account.error=""; return; }   // transient; Supabase owns the session
    var tk = t.getAttribute("data-tools");
    if (tk){ state.tools[tk]=t.value; if(tk!=="city") updateSavings(); return; }
    var memk = t.getAttribute("data-mem");
    if (memk){ var mv=String(t.value).trim(); state.membership[memk] = (mv==="" ? null : (isFinite(parseFloat(mv)) ? parseFloat(mv) : null)); persist(); return; }   // annualDues / purchasePrice (numeric)
    if (t.hasAttribute && t.hasAttribute("data-stay-name") && state.stayForm){ state.stayForm.parkName=t.value; return; }
    if (t.id==="bookingPark"){ state.bookingForm.parkQuery=t.value; state.bookingForm.parkId=null; updateBookingResults(); return; }
    var bk = t.getAttribute("data-booking");
    if (bk){ state.bookingForm[bk]=t.value; return; }
  });
  document.addEventListener("change", function(e){
    var t = e.target; if (!t || !t.getAttribute) return;
    if (t.hasAttribute("data-mem-select")){ setMembershipTier(t.value); render(); return; }
    if (t.hasAttribute("data-mem-date")){ state.membership.purchaseDate=t.value; persist(); return; }
    if (t.hasAttribute("data-stay-park") && state.stayForm){ var sid=parseInt(t.value,10); var sp=sid?parkById(sid):null; state.stayForm.parkId=sp?sp.id:null; state.stayForm.parkName=sp?sp.name:""; state.stayForm.network=sp?sp.network:""; return; }
    if (t.hasAttribute("data-stay-date") && state.stayForm){ state.stayForm.dateIn=t.value; return; }
    var wk=t.getAttribute("data-watch"); if (wk){ if(t.value) state.watch[wk]=t.value; else delete state.watch[wk]; persist(); render(); return; }
    var d = t.getAttribute("data-date");
    if (d){ state.dates[d]=t.value; render(); return; }
    var bd = t.getAttribute("data-bdate");
    if (bd){ state.bookingForm[bd==="in"?"dateIn":"dateOut"]=t.value; render(); return; }   // re-render for live over-limit warning
    var bk = t.getAttribute("data-booking");
    if (bk){ state.bookingForm[bk]=t.value; return; }
  });

  /* Re-check entitlement whenever the tab regains focus/visibility. Re-reads in BOTH directions:
     upgrades when activation lands (3-DS / slow webhook) AND downgrades when a subscription was
     canceled in another tab (Stripe portal/dashboard). Safe to run while Pro because refreshSubscription
     never clobbers Pro on an empty read — only a real row with a non-active status downgrades. */
  function recheckIfBackground(){ if (sb && state.account.session) refreshSubscription(); }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) recheckIfBackground(); });
  window.addEventListener("focus", recheckIfBackground);
  window.addEventListener("pageshow", recheckIfBackground);

  render();
  try { var _inv = new URLSearchParams(location.search || "").get("invite"); if (_inv) localStorage.setItem("hp_invite", _inv.toLowerCase().trim()); } catch(e){}   // capture ?invite=CODE for the launch promo
  // When you return from the external Book-now site, offer to save the trip (park + dates pre-filled).
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState !== "visible") return;
    var pb = state.pendingBook;
    if (!pb || state.bookReturnShow || (Date.now()-(pb.ts||0) <= 3000)) return;
    var ex = pb.fromTripId ? tripById(pb.fromTripId) : null;
    if (ex){
      // Booked an existing trip → jump straight to its Edit form so you can add the confirmation #.
      var p = ex.parkId ? parkById(ex.parkId) : null;
      state.bookingForm = { parkQuery: p?p.name:(ex.parkName||""), parkId: ex.parkId||null, parkName: ex.parkName||"", network: ex.network||"", custom: !ex.parkId, dateIn: ex.dateIn||"", dateOut: ex.dateOut||"", confirmation: ex.confirmation||"", note: ex.note||"", error:"", markBooked:true };
      state.editingTripId = ex.id; state.addBooking = true; state.tab = "trips"; state.pendingBook = null;
      render();
    } else {
      // Booked from a park (no trip yet) → offer to create one.
      state.bookReturnShow = true; render();
    }
  });
  // Capture Chrome/Android's install event so we can replay it from our own Install button, and
  // clear the nudge if the app gets installed by any means. Registered before initAuth so an early
  // beforeinstallprompt is never missed.
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; maybeShowInstall(); });
  window.addEventListener("appinstalled", function(){ deferredInstall = null; state.installPrompt = false; markInstallDismissed(); render(); });
  initAuth();   // restore any persisted Supabase session + reflect signed-in state (no-op if sb is null)
  var sp = document.getElementById("splash");
  if (sp){ sp.style.opacity="0"; setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 480); }
})();
</script>
<script>
  /* Register the service worker for offline use — no-ops where unsupported. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
